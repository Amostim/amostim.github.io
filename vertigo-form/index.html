<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>眩晕问诊</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:0; background:#f4f6f5; color:#1c2420;
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
         font-size:16px; line-height:1.5; }
  .page { max-width:640px; margin:0 auto; padding:16px 14px 96px; }
  header h1 { font-size:22px; margin:8px 0 4px; }
  header p { margin:0 0 4px; color:#5a6a62; font-size:14px; }
  .card { background:#fff; border:1px solid #dde5e0; border-radius:14px; padding:14px; margin-top:12px; }
  .q-title { font-weight:600; margin:0 0 8px; }
  .q-title .req { color:#c0392b; margin-left:2px; }
  .opt { display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid #eef2f0; cursor:pointer; }
  .opt:last-child { border-bottom:none; }
  .opt input { appearance:none; -webkit-appearance:none; width:22px; height:22px; border:2px solid #7d8f86; flex:none; display:inline-block; position:relative; margin:0; background:#fff; }
  .opt input[type="radio"] { border-radius:50%; }
  .opt input[type="checkbox"] { border-radius:4px; }
  .opt input:checked { border-color:#0f766e; background:#0f766e; }
  .opt input:checked::after { content:""; position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; background:#fff; border-radius:50%; }
  .opt input[type="checkbox"]:checked::after { width:10px; height:5px; margin:-8px 0 0 -5px; border:2px solid #fff; border-top:none; border-right:none; transform:rotate(-45deg); border-radius:0; background:transparent; }
  .field { width:100%; padding:10px; border:1px solid #c6d2cb; border-radius:10px; font-size:16px; margin-top:4px; }
  .submit-bar { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); border-top:1px solid #dde5e0; }
  .submit-btn { width:100%; max-width:640px; display:block; margin:0 auto; padding:14px; font-size:17px; font-weight:600; color:#fff; background:#0f766e; border:none; border-radius:12px; }
  .submit-btn:disabled { background:#9fb3ac; }
  .thanks { text-align:center; padding:96px 24px; font-size:20px; font-weight:600; }
  .missing { border-color:#c0392b !important; }
</style>
</head>
<body>
<div class="page" id="root"></div>
<div class="submit-bar" id="submitBar">
  <button class="submit-btn" id="submitBtn" type="button">提交</button>
</div>
<script>
const FORM_DEF = {"formId":"vertigo-form-1.0","formVersion":"1.0","basicInfo":[{"id":"age","type":"number","labelCn":"年龄","required":false,"hintCn":"岁"},{"id":"gender","type":"single","labelCn":"性别","required":false,"options":[{"id":"male","labelCn":"男"},{"id":"female","labelCn":"女"}]}],"questions":[{"id":"q1","type":"single","labelCn":"头晕性质","options":[{"id":"q1_rotatory","labelCn":"天旋地转"},{"id":"q1_nonrotatory","labelCn":"非天旋地转"}]},{"id":"q2","type":"single","labelCn":"持续时间","options":[{"id":"q2_within_1min","labelCn":"1 分钟以内"},{"id":"q2_within_1hour","labelCn":"1 小时以内"},{"id":"q2_persistent","labelCn":"一直晕"}]},{"id":"q3","type":"single","labelCn":"是否第一次发作","options":[{"id":"q3_yes","labelCn":"是"},{"id":"q3_no","labelCn":"否"}]},{"id":"q4","type":"single","labelCn":"发作频率","options":[{"id":"q4_several_times_daily","labelCn":"每天数次"},{"id":"q4_once_daily","labelCn":"每天一次"},{"id":"q4_once_weekly","labelCn":"每周一次"},{"id":"q4_once_monthly","labelCn":"每月一次"},{"id":"q4_once_yearly","labelCn":"每年一次"},{"id":"q4_every_few_months","labelCn":"几月一次"},{"id":"q4_every_few_years","labelCn":"几年一次"}]},{"id":"q5","type":"multi","labelCn":"发作情境","options":[{"id":"q5_spontaneous","labelCn":"无缘无故"},{"id":"q5_turning_in_bed","labelCn":"左右翻身"},{"id":"q5_lying_down_or_getting_up","labelCn":"起床躺下"},{"id":"q5_head_tilting","labelCn":"抬头低头"}]},{"id":"q6","type":"single","labelCn":"双耳听力下降或耳鸣","options":[{"id":"q6_yes","labelCn":"是"},{"id":"q6_no","labelCn":"否"}]},{"id":"q7","type":"multi","labelCn":"发作前预兆","options":[{"id":"q7_flashes","labelCn":"眼前闪光点"},{"id":"q7_vision_loss","labelCn":"眼前视野缺损"},{"id":"q7_tinnitus","labelCn":"耳鸣"}]},{"id":"q8","type":"multi","labelCn":"发作时伴随症状","options":[{"id":"q8_nausea","labelCn":"恶心"},{"id":"q8_vomiting","labelCn":"呕吐"},{"id":"q8_diarrhea","labelCn":"拉肚子"},{"id":"q8_photophobia","labelCn":"怕光"},{"id":"q8_phonophobia","labelCn":"怕声音"},{"id":"q8_smell_aversion","labelCn":"怕味道"},{"id":"q8_tinnitus","labelCn":"耳鸣"},{"id":"q8_ear_fullness","labelCn":"耳闷"},{"id":"q8_hard_of_hearing","labelCn":"听不清"},{"id":"q8_ear_pain","labelCn":"耳痛"},{"id":"q8_ear_discharge","labelCn":"耳流脓"},{"id":"q8_fever","labelCn":"发热"}]},{"id":"q9","type":"single","labelCn":"小时候晕车","options":[{"id":"q9_yes","labelCn":"是"},{"id":"q9_no","labelCn":"否"}]},{"id":"q10","type":"single","labelCn":"偏头痛史","options":[{"id":"q10_yes","labelCn":"有"},{"id":"q10_no","labelCn":"没有"}]},{"id":"q11","type":"single","labelCn":"家族近亲眩晕、晕车、偏头痛","options":[{"id":"q11_yes","labelCn":"有"},{"id":"q11_no","labelCn":"没有"}]},{"id":"q12","type":"single","labelCn":"食物、气味或月经前后更易发作","options":[{"id":"q12_yes","labelCn":"是"},{"id":"q12_no","labelCn":"否"}]},{"id":"q13","type":"multi","labelCn":"特定场景易发作或加重","options":[{"id":"q13_lying_ok_standing_worse","labelCn":"躺着舒服站着走路加重"},{"id":"q13_moving_cars_crowds","labelCn":"川流的汽车和人群"},{"id":"q13_complex_tile_patterns","labelCn":"瓷砖上的复杂花样"},{"id":"q13_zebra_crossing","labelCn":"过马路的斑马线"},{"id":"q13_cinema","labelCn":"电影院"},{"id":"q13_ktv","labelCn":"KTV"},{"id":"q13_supermarket","labelCn":"商场超市"},{"id":"q13_open_square","labelCn":"空旷的广场"}]},{"id":"q14","type":"single","labelCn":"焦虑症、抑郁症、惊恐发作","options":[{"id":"q14_yes","labelCn":"有"},{"id":"q14_no","labelCn":"没有"}]}],"redFlagQuestions":[]};
const COLLECT_TOKEN = new URLSearchParams(window.location.search).get("t") || "";
const FORM_VERSION = "1.0";
const state = { age: "", gender: "", answers: {} };

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render() {
  var root = document.getElementById("root");
  root.innerHTML = "";
  var header = el("header");
  header.appendChild(el("h1", null, "眩晕问诊"));
  header.appendChild(el("p", null, "请逐题作答；标 * 为必填。年龄与性别为选填。"));
  root.appendChild(header);

  // 基本信息（置顶、选填）
  var basicCard = el("section", "card");
  basicCard.appendChild(el("h2", "q-title", "基本信息（选填）"));
  FORM_DEF.basicInfo.forEach(function (field) {
    if (field.type === "number") {
      var wrap = el("div");
      wrap.appendChild(el("label", null, field.labelCn));
      var input = document.createElement("input");
      input.type = "number";
      input.className = "field";
      input.placeholder = field.hintCn ? "（" + field.hintCn + "）" : "";
      input.addEventListener("input", function () { state[field.id] = input.value; });
      wrap.appendChild(input);
      basicCard.appendChild(wrap);
    } else {
      var wrap2 = el("div");
      wrap2.appendChild(el("label", null, field.labelCn));
      field.options.forEach(function (opt) {
        var label = el("label", "opt");
        var input = document.createElement("input");
        input.type = "radio";
        input.name = "basic_" + field.id;
        input.value = opt.id;
        input.addEventListener("change", function () {
          if (input.checked) state[field.id] = opt.id;
        });
        label.appendChild(input);
        label.appendChild(el("span", null, opt.labelCn));
        wrap2.appendChild(label);
      });
      basicCard.appendChild(wrap2);
    }
  });
  root.appendChild(basicCard);

  // 14 题（全必填）
  FORM_DEF.questions.forEach(function (q, idx) {
    var card = el("section", "card");
    card.id = "q_" + q.id;
    var title = el("h2", "q-title");
    title.appendChild(document.createTextNode((idx + 1) + ". " + q.labelCn));
    title.appendChild(el("span", "req", " *"));
    card.appendChild(title);
    q.options.forEach(function (opt) {
      card.appendChild(optionRow(q, opt));
    });
    root.appendChild(card);
  });
}

function optionRow(q, opt) {
  var label = el("label", "opt");
  var input = document.createElement("input");
  input.type = q.type === "single" ? "radio" : "checkbox";
  if (q.type === "single") input.name = "grp_" + q.id;
  input.value = opt.id;
  input.addEventListener("change", function () {
    if (q.type === "single") {
      state.answers[q.id] = input.checked ? [opt.id] : [];
    } else {
      var arr = (state.answers[q.id] || []).slice();
      var i = arr.indexOf(opt.id);
      if (input.checked && i < 0) arr.push(opt.id);
      if (!input.checked && i >= 0) arr.splice(i, 1);
      state.answers[q.id] = arr;
    }
  });
  label.appendChild(input);
  label.appendChild(el("span", null, opt.labelCn));
  return label;
}

function firstUnansweredId() {
  for (var i = 0; i < FORM_DEF.questions.length; i++) {
    var q = FORM_DEF.questions[i];
    if (!state.answers[q.id] || state.answers[q.id].length === 0) return q.id;
  }
  return null;
}

function showThanks() {
  document.getElementById("submitBar").style.display = "none";
  var root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild(el("div", "thanks", "感谢您的填写！"));
}

document.getElementById("submitBtn").addEventListener("click", function () {
  var missing = firstUnansweredId();
  if (missing) {
    var card = document.getElementById("q_" + missing);
    if (card) {
      card.classList.add("missing");
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    window.alert("请完成全部 14 题（标 * 为必填）后再提交。");
    return;
  }
  var btn = document.getElementById("submitBtn");
  btn.disabled = true;
  // 提交体：{ form_version, answers }；基本信息（填了才带）与题目同在一层。
  var answers = {};
  if (state.age !== "") answers.age = state.age;
  if (state.gender !== "") answers.gender = state.gender;
  FORM_DEF.questions.forEach(function (q) { answers[q.id] = state.answers[q.id] || []; });
  var payload = { collect_token: COLLECT_TOKEN, form_version: FORM_VERSION, answers: answers };

  var target = "https://bxjooumydgyqlcmrufjn.supabase.co/functions/v1/vertigo-form" + (COLLECT_TOKEN ? "?t=" + encodeURIComponent(COLLECT_TOKEN) : "");
  fetch(target, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function (resp) {
    if (resp.ok) { showThanks(); return; }
    return resp.json().catch(function () { return null; }).then(function (body) {
      btn.disabled = false;
      var msg = (body && body.error && body.error.message) || ("提交失败（HTTP " + resp.status + "）");
      window.alert(msg);
    });
  }).catch(function () {
    btn.disabled = false;
    window.alert("网络错误，请检查网络后重试。");
  });
});

render();
</script>
</body>
</html>
