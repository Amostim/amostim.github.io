<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>眩晕问诊</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:0; background:#f4f6f5; color:#1c2420;
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
         font-size:16px; line-height:1.5; }
  .page { max-width:640px; margin:0 auto; padding:16px 14px 96px; }
  header h1 { font-size:22px; margin:8px 0 4px; }
  header p { margin:0 0 4px; color:#5a6a62; font-size:14px; }
  .card { background:#fff; border:1px solid #dde5e0; border-radius:14px; padding:14px; margin-top:12px; }
  .q-title { font-weight:600; margin:0 0 8px; }
  .q-title .req { color:#c0392b; margin-left:2px; }
  .opt { display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid #eef2f0; cursor:pointer; }
  .opt:last-child { border-bottom:none; }
  .opt input { appearance:none; -webkit-appearance:none; width:22px; height:22px; border:2px solid #7d8f86; flex:none; display:inline-block; position:relative; margin:0; background:#fff; }
  .opt input[type="radio"] { border-radius:50%; }
  .opt input[type="checkbox"] { border-radius:4px; }
  .opt input:checked { border-color:#0f766e; background:#0f766e; }
  .opt input:checked::after { content:""; position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; background:#fff; border-radius:50%; }
  .opt input[type="checkbox"]:checked::after { width:10px; height:5px; margin:-8px 0 0 -5px; border:2px solid #fff; border-top:none; border-right:none; transform:rotate(-45deg); border-radius:0; background:transparent; }
  .field { width:100%; padding:10px; border:1px solid #c6d2cb; border-radius:10px; font-size:16px; margin-top:4px; }
  .submit-bar { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); border-top:1px solid #dde5e0; }
  .submit-btn { width:100%; max-width:640px; display:block; margin:0 auto; padding:14px; font-size:17px; font-weight:600; color:#fff; background:#0f766e; border:none; border-radius:12px; }
  .submit-btn:disabled { background:#9fb3ac; }
  .thanks { text-align:center; padding:96px 24px; font-size:20px; font-weight:600; }
  .missing { border-color:#c0392b !important; }
</style>
</head>
<body>
<div class="page" id="root"></div>
<div class="submit-bar" id="submitBar">
  <button class="submit-btn" id="submitBtn" type="button">提交</button>
</div>
<script src="./vertigo-form-v3-contract.js"></script>
<script src="./vertigo-form-v3.js"></script>
</body>
</html>
